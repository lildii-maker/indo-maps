# Project-wide Gradle settings.

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx1G -XX:MaxMetaspaceSize=256m -Dfile.encoding=UTF-8

# When configured, Gradle will run in offline mode to prevent network requests.
system.prop.gradle.offline=true

# Kotlin daemon thread client setting to avoid RMI socket connection drops.
kotlin.daemon.useThreadClient=true

# Enables parallel execution for builds
org.gradle.parallel=true

# Enables configuration caching
org.gradle.unsafe.configuration-cache=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
org.gradle.parallel=false
